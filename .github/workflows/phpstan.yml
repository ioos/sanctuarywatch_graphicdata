name: PHP Code Quality

on:
  push:
    branches:
      - main
    paths:
      - 'plugins/graphic_data_plugin/**'
      - 'themes/graphic_data_theme/**'
      - 'composer.json'
      - 'composer.lock'
      - 'phpstan.neon.dist'
      - 'phpcs.xml.dist'
      - '.github/workflows/phpstan.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'plugins/graphic_data_plugin/**'
      - 'themes/graphic_data_theme/**'
      - 'composer.json'
      - 'composer.lock'
      - 'phpstan.neon.dist'
      - 'phpcs.xml.dist'
      - '.github/workflows/phpstan.yml'
  workflow_dispatch:

# Deny all permissions by default
permissions: {}

jobs:
  code-quality:
    name: PHPStan & PHPCS Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # v2.37.2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer, cs2pr

      - name: Validate composer.json
        run: composer validate --no-check-lock

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer update --prefer-dist --no-progress --no-scripts

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --error-format=github --no-progress

      - name: Generate PHPStan report
        if: always()
        run: |
          echo "Generating detailed PHPStan report..."
          vendor/bin/phpstan analyse --error-format=table > phpstan-report.txt 2>&1 || true
          echo "PHPStan analysis completed"
          cat phpstan-report.txt

      - name: Upload PHPStan report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: phpstan-report
          path: phpstan-report.txt
          retention-days: 30

      - name: Run PHPCS
        if: always()
        run: vendor/bin/phpcs -q --report=checkstyle | cs2pr
        continue-on-error: true

      - name: Generate PHPCS report
        if: always()
        run: |
          echo "Generating detailed PHPCS report..."
          vendor/bin/phpcs --report=full > phpcs-report.txt 2>&1 || true
          echo ""
          echo "PHPCS Summary:"
          vendor/bin/phpcs --report=summary 2>&1 || true
          echo ""
          echo "Full report saved to phpcs-report.txt"
          cat phpcs-report.txt

      - name: Upload PHPCS report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: phpcs-report
          path: phpcs-report.txt
          retention-days: 30
